{{- if not .Values.auth.existingSecret }}
{{- $secretName := include "tikloud.authSecretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName) }}
{{- $authSecret := "" }}
{{- $clientSecret := "" }}
{{- if and $existing (index $existing.data "auth-secret") }}
{{- $authSecret = index $existing.data "auth-secret" | b64dec }}
{{- else }}
{{- $authSecret = randAlphaNum 48 }}
{{- end }}
{{- if and $existing (index $existing.data "keycloak-client-secret") }}
{{- $clientSecret = index $existing.data "keycloak-client-secret" | b64dec }}
{{- else }}
{{- $clientSecret = randAlphaNum 40 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "tikloud.labels" . | nindent 4 }}
type: Opaque
data:
  auth-secret: {{ $authSecret | b64enc | quote }}
  keycloak-client-secret: {{ $clientSecret | b64enc | quote }}
  realm.json: {{ include "tikloud.authRealmJson" (dict "root" . "clientSecret" $clientSecret) | b64enc | quote }}
{{- end }}
