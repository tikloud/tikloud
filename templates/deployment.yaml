{{- range $service := .Values.services }}
{{- if $service.enabled }}
{{- $ctx := dict "root" $ "service" $service }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tikloud.serviceFullname" $ctx }}
  labels:
    {{- include "tikloud.serviceLabels" $ctx | nindent 4 }}
spec:
  {{- if not ($service.autoscaling.enabled | default false) }}
  replicas: {{ $service.replicaCount | default $.Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "tikloud.serviceSelectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      {{- with $.Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "tikloud.serviceLabels" $ctx | nindent 8 }}
        {{- with $.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "tikloud.serviceAccountName" $ }}
      {{- with $.Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $service.name }}
          {{- with $.Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ include "tikloud.serviceImage" $ctx | quote }}
          imagePullPolicy: {{ (default dict $service.image).pullPolicy | default $.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $service.containerPort }}
              protocol: TCP
          {{- with $service.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $service.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $service.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- $env := list }}
          {{- range $service.env }}
          {{- $env = append $env . }}
          {{- end }}
          {{- if and $.Values.postgres.enabled (or (eq $service.name "dashboard") (eq $service.name "landing-page")) }}
          {{- $env = append $env (dict "name" "PGHOST" "value" (include "tikloud.postgresFullname" $)) }}
          {{- $env = append $env (dict "name" "PGPORT" "value" (($.Values.postgres.service.port | default 5432) | toString)) }}
          {{- $env = append $env (dict "name" "PGDATABASE" "value" $.Values.postgres.auth.database) }}
          {{- $env = append $env (dict "name" "PGUSER" "value" $.Values.postgres.auth.username) }}
          {{- $env = append $env (dict "name" "PGPASSWORD" "valueFrom" (dict "secretKeyRef" (dict "name" (include "tikloud.postgresSecretName" $) "key" ($.Values.postgres.auth.passwordKey | default "password")))) }}
          {{- end }}
          {{- if and $.Values.keycloak.enabled (eq $service.name "dashboard") }}
          {{- $env = append $env (dict "name" "KEYCLOAK_URL" "value" (printf "https://%s" $.Values.keycloak.ingress.host)) }}
          {{- $env = append $env (dict "name" "KEYCLOAK_REALM" "value" ($.Values.keycloak.realm.name | default "tikloud")) }}
          {{- $env = append $env (dict "name" "KEYCLOAK_CLIENT_ID" "value" ($.Values.keycloak.realm.client.clientId | default "dashboard")) }}
          {{- $env = append $env (dict "name" "KEYCLOAK_CLIENT_SECRET" "valueFrom" (dict "secretKeyRef" (dict "name" (include "tikloud.authSecretName" $) "key" "keycloak-client-secret"))) }}
          {{- $env = append $env (dict "name" "AUTH_SECRET" "valueFrom" (dict "secretKeyRef" (dict "name" (include "tikloud.authSecretName" $) "key" "auth-secret"))) }}
          {{- $env = append $env (dict "name" "AUTH_URL" "value" (printf "https://%s" $service.ingress.host)) }}
          {{- end }}
          {{- if gt (len $env) 0 }}
          env:
            {{- toYaml $env | nindent 12 }}
          {{- end }}
          {{- with $service.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $service.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with $service.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $service.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $service.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $service.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
{{- end }}
{{- end }}
