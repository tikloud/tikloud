{{- range $service := .Values.services }}
{{- if and $service.enabled $service.ingress.enabled }}
{{- $ctx := dict "root" $ "service" $service }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "tikloud.serviceFullname" $ctx }}
  labels:
    {{- include "tikloud.serviceLabels" $ctx | nindent 4 }}
  {{- with $service.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $service.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if $service.ingress.tls }}
  tls:
    {{- range $service.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    - host: {{ $service.ingress.host | quote }}
      http:
        paths:
          - path: {{ $service.ingress.path | default "/" }}
            pathType: {{ $service.ingress.pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "tikloud.serviceFullname" $ctx }}
                port:
                  number: {{ $service.service.port | default 80 }}
---
{{- end }}
{{- end }}
