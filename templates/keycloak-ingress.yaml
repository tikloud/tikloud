{{- if and .Values.keycloak.enabled .Values.keycloak.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "tikloud.keycloakFullname" . }}
  labels:
    {{- include "tikloud.keycloakLabels" . | nindent 4 }}
  {{- if or .Values.keycloak.ingress.annotations (and $.Values.redirectHttpToHttps .Values.keycloak.ingress.tls) }}
  annotations:
    {{- with .Values.keycloak.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if and $.Values.redirectHttpToHttps .Values.keycloak.ingress.tls }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ $.Release.Namespace }}-redirect-https@kubernetescrd
    {{- end }}
  {{- end }}
spec:
  {{- with .Values.keycloak.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.keycloak.ingress.tls }}
  tls:
    {{- range .Values.keycloak.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.keycloak.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.keycloak.ingress.path | default "/" }}
            pathType: {{ .Values.keycloak.ingress.pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "tikloud.keycloakFullname" . }}
                port:
                  number: {{ .Values.keycloak.service.port | default 8080 }}
{{- end }}
