{{- if and .Values.keycloak.enabled .Values.keycloak.provisioning.enabled }}
{{- $server := printf "http://%s:%d" (include "tikloud.keycloakFullname" .) (int (.Values.keycloak.service.port | default 8080)) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-provision" (include "tikloud.keycloakFullname" .) }}
  labels:
    {{- include "tikloud.keycloakLabels" . | nindent 4 }}
spec:
  # A stable Job name means ArgoCD creates it once and does not re-run it on
  # later syncs; delete the Job to re-provision (or to rotate the client secret).
  backoffLimit: 6
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: provision
          image: {{ printf "%s:%s" .Values.keycloak.image.repository .Values.keycloak.image.tag | quote }}
          imagePullPolicy: {{ .Values.keycloak.image.pullPolicy | default "IfNotPresent" }}
          command:
            - /bin/bash
            - -ec
            - |
              set -e
              export PATH=$PATH:/opt/keycloak/bin
              SERVER="{{ $server }}"
              REALM="{{ .Values.keycloak.realm.name }}"
              CLIENT_ID="{{ .Values.keycloak.realm.client.clientId }}"
              REDIRECT_URIS='{{ .Values.keycloak.realm.client.redirectUris | toJson }}'

              echo "Waiting for Keycloak at $SERVER"
              for i in $(seq 1 60); do
                if kcadm.sh config credentials \
                    --server "$SERVER" --realm master \
                    --user "$KC_ADMIN_USER" --password "$KC_ADMIN_PASSWORD" \
                    >/dev/null 2>&1; then
                  break
                fi
                sleep 5
              done
              kcadm.sh get realms >/dev/null
              echo "Keycloak is ready"

              if ! kcadm.sh get "realms/$REALM" >/dev/null 2>&1; then
                echo "Creating realm $REALM"
                kcadm.sh create realms \
                  -s "realm=$REALM" \
                  -s enabled=true \
                  -s registrationAllowed=true \
                  -s registrationEmailAsUsername=true \
                  -s loginWithEmailAllowed=true
              else
                echo "Realm $REALM already exists"
              fi

              if ! kcadm.sh get "clients?clientId=$CLIENT_ID" -r "$REALM" | grep -q '"id"'; then
                echo "Creating client $CLIENT_ID"
                kcadm.sh create clients -r "$REALM" \
                  -s "clientId=$CLIENT_ID" \
                  -s enabled=true \
                  -s protocol=openid-connect \
                  -s "secret=$KC_CLIENT_SECRET" \
                  -s "redirectUris=$REDIRECT_URIS" \
                  -s publicClient=false \
                  -s directAccessGrantsEnabled=false
              else
                echo "Client $CLIENT_ID already exists"
                CLIENT_UUID=$(kcadm.sh get "clients?clientId=$CLIENT_ID" -r "$REALM" \
                  | python3 -c 'import sys,json;print(json.load(sys.stdin)[0]["id"])')
                kcadm.sh update "clients/$CLIENT_UUID" -r "$REALM" \
                  -s "secret=$KC_CLIENT_SECRET" \
                  -s "redirectUris=$REDIRECT_URIS"
              fi
              echo "Provisioning complete"
          env:
            - name: KC_ADMIN_USER
              value: {{ .Values.keycloak.auth.adminUser | default "admin" | quote }}
            - name: KC_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "tikloud.keycloakSecretName" . }}
                  key: {{ .Values.keycloak.auth.adminPasswordKey | default "admin-password" }}
            - name: KC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "tikloud.authSecretName" . }}
                  key: keycloak-client-secret
      {{- with .Values.keycloak.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.keycloak.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.keycloak.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
