{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.postgres.schema.initScriptName | default "tikloud-schema-init" }}
  labels:
    {{- include "tikloud.postgresLabels" . | nindent 4 }}
data:
  02-tikloud-schema.sql: |
    -- Ti Kloud application schema. Mirrors packages/db/migrations/0001_init.sql.
    create table if not exists profiles (
      id text primary key,
      email text,
      display_name text,
      created_at timestamptz not null default now()
    );

    create table if not exists waitlist (
      id bigint generated by default as identity primary key,
      email text not null unique,
      created_at timestamptz not null default now()
    );
{{- end }}
