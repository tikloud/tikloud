{{- if .Values.postgres.enabled }}
{{- if not .Values.postgres.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tikloud.postgresSecretName" . }}
  labels:
    {{- include "tikloud.postgresLabels" . | nindent 4 }}
type: Opaque
data:
  {{- $secretName := include "tikloud.postgresSecretName" . }}
  {{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName) }}
  {{- $passwordKey := .Values.postgres.auth.passwordKey | default "password" }}
  {{- if and $existing (index $existing.data $passwordKey) }}
  {{ $passwordKey }}: {{ index $existing.data $passwordKey }}
  {{- else }}
  {{ $passwordKey }}: {{ randAlphaNum 40 | b64enc | quote }}
  {{- end }}
{{- end }}
{{- end }}
