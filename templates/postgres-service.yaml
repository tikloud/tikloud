{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tikloud.postgresFullname" . }}
  labels:
    {{- include "tikloud.postgresLabels" . | nindent 4 }}
spec:
  type: {{ .Values.postgres.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.postgres.service.port | default 5432 }}
      targetPort: {{ .Values.postgres.port | default 5432 }}
      protocol: TCP
      name: postgres
  selector:
    {{- include "tikloud.postgresSelectorLabels" . | nindent 4 }}
{{- end }}
