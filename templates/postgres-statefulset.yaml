{{- if .Values.postgres.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "tikloud.postgresFullname" . }}
  labels:
    {{- include "tikloud.postgresLabels" . | nindent 4 }}
spec:
  serviceName: {{ include "tikloud.postgresFullname" . }}
  replicas: {{ .Values.postgres.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "tikloud.postgresSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with $.Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "tikloud.postgresLabels" . | nindent 8 }}
        {{- with $.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgres
          image: {{ printf "%s:%s" .Values.postgres.image.repository .Values.postgres.image.tag | quote }}
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: postgres
              containerPort: {{ .Values.postgres.port | default 5432 }}
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.auth.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "tikloud.postgresSecretName" . }}
                  key: {{ .Values.postgres.auth.passwordKey | default "password" }}
            {{- if .Values.keycloak.enabled }}
            - name: KEYCLOAK_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "tikloud.keycloakSecretName" . }}
                  key: {{ .Values.keycloak.auth.dbPasswordKey | default "db-password" }}
            {{- end }}
          {{- with .Values.postgres.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.postgres.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- else }}
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.auth.username | quote }}]
            initialDelaySeconds: 30
            periodSeconds: 10
          {{- end }}
          {{- with .Values.postgres.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- else }}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.auth.username | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
          {{- end }}
          {{- if or .Values.postgres.persistence.enabled .Values.keycloak.enabled }}
          volumeMounts:
            {{- if .Values.postgres.persistence.enabled }}
            - name: data
              mountPath: /var/lib/postgresql/data
            {{- end }}
            {{- if .Values.keycloak.enabled }}
            - name: keycloak-db-init
              mountPath: /docker-entrypoint-initdb.d/01-keycloak.sh
              subPath: 01-keycloak.sh
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or (and .Values.postgres.persistence.enabled .Values.postgres.persistence.existingClaim) .Values.keycloak.enabled }}
      volumes:
        {{- if and .Values.postgres.persistence.enabled .Values.postgres.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.postgres.persistence.existingClaim }}
        {{- end }}
        {{- if .Values.keycloak.enabled }}
        - name: keycloak-db-init
          configMap:
            name: {{ .Values.keycloak.database.initScriptName | default "keycloak-db-init" }}
            defaultMode: 0755
        {{- end }}
      {{- end }}
      {{- with .Values.postgres.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgres.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgres.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.postgres.persistence.enabled }}
  {{- if not .Values.postgres.persistence.existingClaim }}
  volumeClaimTemplates:
    - metadata:
        name: data
        # Version-stable labels only: stamping helm.sh/chart (which embeds the
        # chart version) here would change the immutable volumeClaimTemplates
        # field on every chart bump and break ArgoCD patching.
        labels:
          app.kubernetes.io/name: postgres
          app.kubernetes.io/instance: {{ .Release.Name }}
          app.kubernetes.io/component: postgres
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgres.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
  {{- end }}
  {{- end }}
{{- end }}
